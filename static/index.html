<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Sessie Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Prompt Sessie Manager</h1>

    <form id="prompt-form">
      <div class="veld">
        <label for="rol">Rol <span class="verplicht">*</span></label>
        <input type="text" id="rol" name="rol" placeholder="senior Python developer">
        <p data-testid="validation-rol" class="validatie hidden">Vul een rol in.</p>
      </div>

      <div class="veld">
        <label for="taak">Taak <span class="verplicht">*</span></label>
        <input type="text" id="taak" name="taak" placeholder="een REST API bouwen">
        <p data-testid="validation-taak" class="validatie hidden">Vul een taak in.</p>
      </div>

      <div class="veld">
        <label for="doel">Doel <span class="verplicht">*</span></label>
        <input type="text" id="doel" name="doel" placeholder="gebruikersdata op te slaan">
        <p data-testid="validation-doel" class="validatie hidden">Vul een doel in.</p>
      </div>

      <div class="veld">
        <label for="formaat">Formaat</label>
        <input type="text" id="formaat" name="formaat" placeholder="JSON, markdown, bullet points">
      </div>

      <div class="veld">
        <label for="stijl">Stijl</label>
        <input type="text" id="stijl" name="stijl" placeholder="technisch, beknopt, formeel">
      </div>

      <div class="veld">
        <label for="scope">Scope</label>
        <input type="text" id="scope" name="scope" placeholder="backend only, één bestand">
      </div>

      <div class="veld">
        <label for="eisen">Extra eisen</label>
        <textarea id="eisen" name="eisen" placeholder="geen externe afhankelijkheden" rows="3"></textarea>
      </div>

      <div class="veld">
        <label for="voorbeelden">Voorbeelden</label>
        <textarea id="voorbeelden" name="voorbeelden" placeholder="zie bijlage, functielijst" rows="3"></textarea>
      </div>

      <button type="button" id="submit">Verstuur</button>

      <div class="veld">
        <label for="session-name">Sessienaam</label>
        <input type="text" id="session-name" name="session-name" placeholder="mijn-sessie">
        <p data-testid="validation-session-name" class="validatie hidden">Vul een sessienaam in.</p>
      </div>

      <button type="button" id="opslaan-knop">Opslaan</button>
    </form>

    <p data-testid="save-confirmation" class="hidden"></p>
    <p data-testid="save-error" class="hidden"></p>

    <div data-testid="overwrite-dialog" class="hidden">
      <p>Er bestaat al een sessie met deze naam. Wilt u overschrijven?</p>
      <button type="button" id="bevestig-overschrijven">Ja, overschrijven</button>
      <button type="button" id="annuleer-overschrijven">Annuleren</button>
    </div>

    <div data-testid="loading" class="hidden">Bezig met laden...</div>

    <p data-testid="log-status" class="hidden"></p>
    <p data-testid="log-warning" class="hidden"></p>

    <div data-testid="response" class="hidden"></div>

    <div data-testid="error" class="hidden"></div>

    <section>
      <h2>Opgeslagen sessies</h2>
      <div data-testid="sessions-list">
        <p data-testid="sessions-empty">Nog geen sessies opgeslagen.</p>
      </div>
      <p data-testid="load-error" class="hidden"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
