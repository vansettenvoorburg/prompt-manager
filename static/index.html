<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Sessie Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Prompt Sessie Manager</h1>

    <textarea id="prompt" placeholder="Typ hier je prompt..." rows="8"></textarea>

    <button id="submit">Versturen</button>

    <p data-testid="validation-message" class="hidden">Vul een prompt in voor je verstuurt.</p>

    <div data-testid="loading" class="hidden">Bezig met laden...</div>

    <div data-testid="response" class="hidden"></div>

    <div data-testid="error" class="hidden"></div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
